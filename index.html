<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极智云 · 企业级综合门户</title>
<meta name="description" content="极智云 - 驱动企业数字化未来，提供云服务、数据分析、AI应用、安全防护一体化解决方案">





<!-- ===== Tailwind CSS v3 (本地版，支持暗黑模式配置) ===== -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50:'#eef6ff',100:'#d9eaff',200:'#bcd9ff',300:'#8ec0ff',400:'#599cff',
            500:'#3373ff',600:'#1c52f5',700:'#163fe1',800:'#1934b6',900:'#1b338f'
          }
        },
        fontFamily: { sans: ['"Microsoft YaHei"','sans-serif'] }
      }
    }
  }
</script>
<script>document.title = 'HEAD CONFIG OK';</script>

<!-- ===== Font Awesome 图标库（JS版） ===== -->
<script src="assets/lib/fontawesome/all.min.js"></script>

<!-- ===== Swiper 轮播 ===== -->
<link rel="stylesheet" href="assets/lib/swiper/swiper-bundle.min.css">

<!-- ===== AOS 滚动动画 ===== -->
<link rel="stylesheet" href="assets/lib/aos/aos.css">

<!-- ===== 项目自定义样式 ===== -->
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300">
<script>document.title = 'BODY START OK';</script>

<!-- ===== 全局加载动画 ===== -->
<div id="globalLoader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white dark:bg-slate-900">
  <div class="loader-circle"></div>
  <p class="ml-4 text-brand-500 font-medium">极智云加载中...</p>
</div>

<!-- ===== 导航栏（滚动吸顶 + 移动端汉堡菜单 + 登录状态动态） ===== -->
<nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="#/home" class="flex items-center gap-2 font-bold text-lg">
        <i class="fa-solid fa-cube text-brand-500 text-2xl"></i>
        <span id="navLogo">极智云</span>
      </a>
      <!-- 桌面端菜单 -->
      <div id="navMenu" class="hidden md:flex items-center gap-1"></div>
      <!-- 右侧操作 -->
      <div class="flex items-center gap-2">
        <!-- 主题切换 -->
        <button onclick="App.toggleTheme()" class="icon-btn" title="切换主题" aria-label="切换主题">
          <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
        <!-- 设置面板 -->
        <button onclick="App.openSettings()" class="icon-btn" title="设置" aria-label="设置">
          <i class="fa-solid fa-gear"></i>
        </button>
        <!-- 用户区（动态） -->
        <div id="navUser"></div>
        <!-- 移动端汉堡 -->
        <button onclick="App.toggleMobileMenu()" class="icon-btn md:hidden" aria-label="菜单">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </div>
  <!-- 移动端展开菜单 -->
  <div id="mobileMenu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800"></div>
</nav>

<!-- ===== 主内容容器（SPA 路由渲染区） ===== -->
<main id="app" class="min-h-screen pt-16"></main>

<!-- ===== 页脚 ===== -->
<footer id="footer" class="bg-slate-100 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 mt-12"></footer>

<!-- ===== 回到顶部悬浮按钮 ===== -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" class="fixed bottom-6 right-6 z-40 icon-btn shadow-lg opacity-0 pointer-events-none transition-opacity">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<!-- ===== Toast 消息容器 ===== -->
<div id="toastContainer" class="fixed top-20 right-4 z-[100] flex flex-col gap-2"></div>

<!-- ===== 模态弹窗容器（通用） ===== -->
<div id="modalContainer"></div>

<!-- ===== 设置面板（主题色/字体大小/明暗模式） ===== -->
<div id="settingsPanel" class="settings-panel">
  <div class="flex items-center justify-between mb-4">
    <h3 class="font-bold text-lg"><i class="fa-solid fa-palette text-brand-500 mr-2"></i>全局设置</h3>
    <button onclick="App.closeSettings()" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <!-- 明暗模式 -->
  <div class="mb-4">
    <label class="block text-sm font-medium mb-2">显示模式</label>
    <div class="flex gap-2">
      <button onclick="App.setTheme('light')" class="theme-opt flex-1"><i class="fa-solid fa-sun mr-1"></i>浅色</button>
      <button onclick="App.setTheme('dark')" class="theme-opt flex-1"><i class="fa-solid fa-moon mr-1"></i>深色</button>
    </div>
  </div>
  <!-- 主题色 -->
  <div class="mb-4">
    <label class="block text-sm font-medium mb-2">主题色</label>
    <div class="flex gap-2 flex-wrap" id="themeColorPicker">
      <button onclick="App.setThemeColor('#3373ff')" style="background:#3373ff" class="color-dot"></button>
      <button onclick="App.setThemeColor('#22c55e')" style="background:#22c55e" class="color-dot"></button>
      <button onclick="App.setThemeColor('#f59e0b')" style="background:#f59e0b" class="color-dot"></button>
      <button onclick="App.setThemeColor('#ef4444')" style="background:#ef4444" class="color-dot"></button>
      <button onclick="App.setThemeColor('#8b5cf6')" style="background:#8b5cf6" class="color-dot"></button>
      <button onclick="App.setThemeColor('#06b6d4')" style="background:#06b6d4" class="color-dot"></button>
    </div>
  </div>
  <!-- 字体大小 -->
  <div class="mb-4">
    <label class="block text-sm font-medium mb-2">字体大小</label>
    <input type="range" id="fontRange" min="13" max="20" value="16" class="w-full accent-brand-500" oninput="App.setFontSize(this.value)">
    <div class="flex justify-between text-xs text-slate-400 mt-1"><span>小</span><span id="fontVal">16px</span><span>大</span></div>
  </div>
</div>

<!-- ===== 图片预览弹窗 ===== -->
<div id="imageViewer" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/80 p-4" onclick="App.closeImageViewer()">
  <img id="imageViewerImg" class="max-w-full max-h-full rounded-lg" src="" alt="预览">
</div>

<!-- ===== JS 依赖库 ===== -->
<script src="assets/lib/swiper/swiper-bundle.min.js"></script>
<script src="assets/lib/aos/aos.js"></script>
<!-- <script src="assets/lib/chartjs/chart.umd.min.js"></script> -->

<!-- ===== 项目 JS 模块（按依赖顺序加载） ===== -->
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/router.js"></script>
<script>document.title = 'ROUTER OK';</script>

<!-- <script src="assets/js/pages/user.js"></script> -->
<!-- <script src="assets/js/pages/news.js"></script> -->
<!-- <script src="assets/js/pages/shop.js"></script> -->
<!-- <script src="assets/js/pages/admin.js"></script> -->
<script>document.title = 'DEBUG OK';</script>
<script src="assets/js/app.js"></script>
</body>
</html>
